<!DOCTYPE html>
<html lang="pt-br" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de pessoas</title>
</head>
<body>
    
    <h1>Cadastro de pessoas</h1>

    <nav>
        <a href="/">Voltar</a>
    </nav>

    <form method="get" action="/pessoas/cadastrar">

        <div>
            <label for="nome">Nome</label>
            <input 
                type="text" 
                id="nome" 
                name="nomeDaPessoa"
                placeholder="Nome da pessoa"
                required
                minlength="3"
            >
        </div>

        <div>
            <label for="senha">Senha</label>
            <input type="password" name="senha" id="senha">
        </div>

        <div>
            <label>Gênero</label>

            <div>

                <div>
                    <input 
                        type="radio"
                        name="genero"
                        id="feminino"
                        value="FEM"
                    >
                    <label for="feminino">Feminino</label>
                </div>

                <div>
                    <input 
                        type="radio"
                        name="genero"
                        id="masculino"
                        value="MAS"
                    >
                    <label for="masculino">Masculino</label>
                </div>

                <div>
                    <input 
                        type="radio"
                        name="genero"
                        id="naobinario"
                        value="NBI"
                    >
                    <label for="naobinario">Não binário</label>
                </div>

                <div>
                    <input 
                        type="radio"
                        name="genero"
                        id="semresposta"
                        value="SRE"
                    >
                    <label for="semresposta">Prefiro não responder</label>
                </div>

            </div>

        </div>

        <div>
            <label>Notificações</label>

            <div>
                <input 
                    type="checkbox"
                    name="notificacao[0]"
                    id="email"
                >
                <label for="email">Email</label>
            </div>

            <div>
                <input 
                    type="checkbox"
                    name="notificacao[1]"
                    id="whatsapp"
                >
                <label for="whatsapp">WhatsApp</label>
            </div>
            <div>
                <input 
                    type="checkbox"
                    name="notificacao[2]"
                    id="telegram"
                >
                <label for="telegram">Telegram</label>
            </div>

            <div>
                <input 
                    type="checkbox"
                    name="notificacao[3]"
                    id="signal"
                >
                <label for="signal">Signal</label>
            </div>
        </div>

        <div>
            <label for="uf">Estado/UF</label>

            <select name="uf" id="uf">

                <option 
                    value="0"
                    disabled
                    selected
                >Selecione:</option>

                <option value="1">Minas Gerais</option>
                <option value="2">São Paulo</option>
                <option value="3">Rio de Janeiro</option>
                <option value="4">Espírito Santo</option>
                <option value="5">Bahia</option>
                <option value="6">Pará</option>

            </select>

        </div>

        <div>
            <label for="cidade">Cidade</label>
            <select name="cidade" id="cidade">
                <option 
                    value="0"
                    disabled
                    selected
                >Selecione:</option>
            </select>
        </div>

        <div>
            <label for="cor">Cor padrão do perfil</label>
            <input type="color" name="cor" id="cor">
        </div>

        <div>
            <label for="data">Data de nascimento</label>
            <input type="date" name="data" id="data">
        </div>

        <br><br><br><br><br>

        <div>
            <input type="submit" value="Cadastrar">
            <button type="submit">Cadastrar (button)</button>
            <button type="reset">Limpar</button>
        </div>

        <br><br><br><br><br><br><br><br><br><br>

    </form>



</body>
</html>
